<header class="flex flex-wrap items-center gap-x-4 gap-y-2 border-b bg-sidebar px-6 py-4">
  <div class="flex items-center gap-2.5 whitespace-nowrap">
    <span class="text-[22px] font-bold tracking-tight text-primary">Amundi</span>
    <span class="border-l pl-2.5 text-sm text-muted-foreground">Épargne Salariale</span>
  </div>
  <!-- Audience switch from the design mock: display only for now. -->
  <div class="flex gap-1 text-sm font-semibold" aria-hidden="true">
    <span class="rounded-full bg-primary px-3.5 py-1.5 text-primary-foreground">Épargnant</span>
    <span class="px-3.5 py-1.5 text-muted-foreground">Entreprise</span>
  </div>
  <div class="ml-auto flex items-center gap-2">
    <button type="button" (click)="theme.toggle()" aria-label="Changer de thème" class="inline-flex h-9 cursor-pointer items-center gap-2 rounded-full border bg-sidebar px-3.5 text-sm font-semibold text-foreground">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path [attr.d]="theme.dark() ? moonIcon : sunIcon" />
      </svg>
      {{ theme.dark() ? 'Sombre' : 'Clair' }}
    </button>
    @if (auth.user(); as u) {
      @if (logoutFailed()) { <span role="alert" class="text-sm text-destructive">Déconnexion impossible, réessayez.</span> }
      <span class="text-sm text-muted-foreground">{{ u.email }}</span>
      <button type="button" (click)="logout()" class="inline-flex h-9 cursor-pointer items-center rounded-full border bg-sidebar px-4 text-sm font-semibold text-foreground">Déconnexion</button>
    } @else {
      <a routerLink="/connexion" class="inline-flex h-9 items-center rounded-full bg-[var(--amundi-red)] px-4 text-sm font-semibold text-white">Mon compte</a>
    }
  </div>
</header>
<nav class="border-b bg-secondary px-8">
  <ul class="flex flex-wrap gap-1 py-2.5">
    @for (l of links; track l.path) {
      <li><a [routerLink]="l.path" routerLinkActive="bg-accent text-accent-foreground" class="inline-flex h-9 items-center rounded-full px-[18px] text-[15px] font-semibold text-muted-foreground">{{ l.label }}</a></li>
    }
  </ul>
</nav>
<main class="mx-auto max-w-5xl p-8"><router-outlet /></main>
